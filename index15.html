<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Destructuring</title>
    <script>
        let arr = ["Adarsh","Singh","Vikas"];
        let [firstName,lastName,roll] = arr;
        console.log(firstName);
        console.log(lastName);
        console.log(roll);

        let arr1 = ["Adarsh","Singh","Vikas"];
        let [firstName1,lastName1,roll1] = arr1;
        console.log(firstName1);
        console.log(lastName1);
        console.log(roll1);
    </script>
</head>
<body>
    
</body>
</html>
