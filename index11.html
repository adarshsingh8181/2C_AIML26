<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
    <script>
        let arr = [1, 2, 3];
        function sum(...args) {
            let sum = 0;
            for (i of args) {
                sum = sum + i;

            }
            console.log(sum);
        }
        sum(10,20,30,40,50);
        sum(...arr);
        console.log(...arr);
        console.log(arr);
    </script>
</head>

</body>

</html>
