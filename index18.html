<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Details</title>
    <Script>
        class Bank{
            static bankname = "kotak bank";

            constructor(accountno, holdername, balance){
                this.accountno = accountno;
                this.holdername = holdername;
                this.balance = balance;
            }

            deposit(money){
                this.balance = this.balance + money;
                console.log("deposited money is: ",money);      
            }
            
            withdraw(money){
                if(money>this.balance){
                    console.log("Insufficient balance");
                } else {
                    this.balance = this.balance - money;
                    console.log("withdrawn money is: ",money);
                }
            }

            display(){
                console.log("current balance is:", this.balance);
            }
        }

        let acc1 = new Bank(1001, "Adarsh Singh", 10000);
        let acc2 = new Bank(1002, "Vikas Sir", 5000);

        acc1.deposit(2000);
        acc1.withdraw(15000);
        acc1.display();

        acc2.deposit(1000);
        acc2.withdraw(3000);
        acc2.display();
    </Script>
</head>
<body>
    
</body>
</html>
